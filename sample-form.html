<!DOCTYPE html>
<html>
<body>

<h2>Text input fields</h2>

<form action="https://www.w3schools.com/action_page.php" method="get">
  <label for="fname">First name:</label><br>
  <input type="text" id="fname" name="fname" value=""><br>
  <label for="lname">Last name:</label><br>
  <input type="text" id="lname" name="lname" value=""><br>
  <label for="age">Age:</label><br>
  <input type="text" id="age" name="age" value=""><br>
  <label for="lname">Address:</label><br>
  <textarea name="txtaddress"></textarea><br>  
  <label for="lname">Gender:</label><br>
  <label for="male"> <input type="radio" id="male" name="male" value="Male"> Male </label>&nbsp;&nbsp;<label for="female"><input type="radio" id="female" name="male" value="Female"> Female</label><br>
  <label for="lname">Hobbies:</label><br>
  <label for="cricket"><input type="checkbox" id="cricket" name="hobbies" value="cricket"> Cricket </label><label for="drawing"><input type="checkbox" id="drawing" name="hobbies" value="Drawing"> Drawing </label><label for="driving"><input type="checkbox" id="driving" name="hobbies" value="Driving"> Driving </label><label for="editing"><input type="checkbox" id="editing" name="hobbies" value="Editing"> Editing </label><label for="blogging"><input type="checkbox" id="blogging" name="hobbies" value="Blogging"> Blogging </label><label for="gardening"><input type="checkbox" id="gardening" name="hobbies" value="gardening"> Gardening </label><label for="tennis"><input type="checkbox" id="tennis" name="hobbies1" value="tennis"> Tennis </label>

  <br><br>
  <input type="submit" name="submitbtn" value="Save" />
</form>

<p>Note that the form itself is not visible.</p>

<p>Also note that the default width of text input fields is 20 characters.</p>

</body>
</html>
